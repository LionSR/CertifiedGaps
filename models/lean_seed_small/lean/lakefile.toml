name = "LeanSeedSmall"
defaultTargets = ["LeanSeedSmall"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "LeanSeedSmall"

# The repository's own Lean sources, compiled in place (read-only) into this project's .lake,
# with the same options as ../../../lean/lakefile.toml. Nothing is copied or patched.
[[lean_lib]]
name = "CertifiedGaps"
srcDir = "../../../lean"

[lean_lib.leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
