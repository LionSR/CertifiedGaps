# Jekyll configuration of the project home page (leanblueprint template, cayman remote theme),
# built by docgen-action in .github/workflows/blueprint.yml.
#
# Every page builds links with `relative_url` / `absolute_url`, and GitHub links from
# `repository`, so moving the site or renaming the repository only changes `url`, `baseurl`
# and `repository` below. For a local preview at the server root, override them:
#     bundle exec jekyll build --baseurl "" --config _config.yml,<file with url: "">
#
# The leaderboard rows live in _data/records.yml (hand-edited; schema in its header).
# _data/lean_records.json is generated in CI by `lake exe leaderboard_audit` (not committed).

title: Certified spectral gaps by the spacetime bootstrap
description: Uniform spectral gaps of quantum spin chains, certified by computer and formalized in Lean 4
baseurl: "/haldane-gap-diagrams" # the subpath of the site
url: "https://LionSR.github.io" # the base hostname and protocol of the site
twitter_username:
github_username: LionSR
repository: LionSR/haldane-gap-diagrams
branch: main # the branch that certificate and checker links point to

# Build settings
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
