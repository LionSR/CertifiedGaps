# The leaderboard data: the single hand-edited source of the leaderboard page. Validate after
# every edit:
#     julia --project=code/tools/leaderboard code/tools/leaderboard/check_records.jl
# Exact numbers are strings: "13480", "97/4". Decimals are strings rounded down. LaTeX goes
# between $...$. Text fields may hold inline HTML; they are not Markdown.
#
# tiers: the six ways a bound can be established, with the words the site uses for them.
#   key, glyph, label (the one name used everywhere), meaning (one sentence for the legend)
#
# families: one per Hamiltonian with free parameters.
#   key, name, hamiltonian (LaTeX), slug (code/models/<slug>/, optional), cells (what L counts),
#   gap_source (where the numerical gaps of its records come from),
#   grid {rows, cols} (optional: show the family as a grid of params[rows] x params[cols])
#
# challenges: open problems listed on the leaderboard.
#   id, title, need (what is needed and what it would establish), family (optional),
#   link (a URL or a repository path, optional)
#
# records: one per model, parameter point and claim.
#   id            kebab-case, unique; the row's anchor
#   family        a family key
#   parameter     display form (LaTeX); params: {name: exact} (optional, used by the grid)
#   lengths       {L0, parity (default even), boundary (default periodic)}: the claim covers every
#                 ring length L >= L0 of that parity
#   bound         the best rigorous bound: {r, beta} means Delta_L > log(r)/beta; {value} means
#                 Delta_L >= value (> with strict: true). decimal is its display, rounded down;
#                 display is LaTeX for the exact form (optional). Absent for targets.
#   seed          {n0, beta0, text (optional)}: the starting ring length and inverse temperature
#   estimate      targets only: {n0, beta0, float_bound, text}, floating-point survey values
#   numerical_gap the best numerical estimate of the gap; gap_source overrides the family's
#   tier          the tier of the bound shown. A Lean tier is allowed exactly when the Lean
#                 theorem below proves at least that bound (the validator checks this exactly);
#                 the page then takes the Lean kind from the generated lean_records.json.
#   lean          {name, r, beta, decimal}: the Lean theorem Delta_L > log(r)/beta for every even
#                 L >= lengths.L0; must match lean_records.json. When the theorem starts from
#                 another seed than the row, lean.certificate names the certificate of that seed
#   certificate   path of the certificate data; check: path of the checker (default
#                 code/models/<slug>/check.jl)
#   date, pr      when and in which pull request the current bound was set (pr may be null)
#   contributors  GitHub handles of the people who set the bound (linked to their profiles);
#                 a group without a handle is written as a plain name, e.g. 'OpenAI (preprint)'
#   method        how the current bound was obtained, a few words (optional; shown in the
#                 record-over-time table)
#   notes         free text (optional)
#   history       earlier bounds, newest first (larger bound first on the same date):
#                 [{date, decimal, display (optional), lengths, tier, pr, method}]

tiers:
  - {key: lean-unconditional, glyph: '◆', label: 'Lean 4 (unconditional)',
     meaning: 'Formalized in Lean 4 with no external hypotheses; both the finite seed bounds at (n₀, β₀) and the doubling recurrence are checked inside the Lean kernel.'}
  - {key: lean-conditional, glyph: '◇', label: 'Lean 4 (certified seed)',
     meaning: 'Formalized in Lean 4 conditional only on the computer-certified seed purity inequalities at (n₀, β₀).'}
  - {key: certified, glyph: '✓', label: 'Computer-certified',
     meaning: 'Headline bound computed by 48 interval-arithmetic doubling steps from verified seed spectra and checked by check.jl. Most rows also have a companion 14-step rational chain in Lean 4 (◇) proving a smaller lower bound (typically within 10⁻⁵ when starting from the same seed, more where the gap is large).'}
  - {key: target, glyph: '◌', label: 'Open target',
     meaning: 'Floating-point survey estimate only; not yet certified.'}


families:
  - key: spin1-heisenberg
    name: 'Spin-1 Heisenberg chain'
    hamiltonian: '$H_L = \sum_{j=1}^{L} \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1}$'
    slug: spin1
    cells: 'sites'
    gap_source: >-
      <a href="https://arxiv.org/abs/cond-mat/9911047">Todo and Kato</a>, quantum Monte Carlo
  - key: spin1-open
    name: 'Spin-1 Heisenberg open chain with endpoint fields'
    hamiltonian: '$H_n = \sum_{i=1}^{n-1} \boldsymbol{S}_i \cdot \boldsymbol{S}_{i+1} - h\,(S_1^z + S_n^z)$'
    cells: 'sites'
    gap_source: >-
      bulk value of the periodic chain (<a href="https://arxiv.org/abs/cond-mat/9911047">Todo
      and Kato</a>, quantum Monte Carlo); the open-chain gap is not estimated separately
  - key: heisenberg-staggered-field
    name: 'Spin-1/2 Heisenberg chain in a staggered field'
    hamiltonian: '$H_L = \sum_j \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1} - h \sum_j (-1)^j S_j^z$'
    slug: heisenberg_staggered_field
    cells: 'sites'
    gap_source: '16-site ring, exact diagonalization'
  - key: dimerized-heisenberg
    name: 'Dimerized spin-1/2 Heisenberg chain'
    hamiltonian: >-
      $H_L = \sum_{j=1}^{2L} [1 + (-1)^j \delta]\, \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1}$
    slug: dimerized_heisenberg
    cells: 'two-spin cells ($N = 2L$ spins)'
    gap_source: '20-spin ring, Krylov method'
  - key: spin1-dimerized
    name: 'Dimerized spin-1 Heisenberg chain'
    hamiltonian: '$H_L = \sum_{j=1}^{2L} [1 + (-1)^j \delta]\, \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1}$'
    slug: spin1_dimerized
    cells: 'two-spin cells ($N = 2L$ spins)'
    gap_source: '12-spin ring, exact diagonalization'
  - key: spin1-largeD
    name: 'Spin-1 chain with single-ion anisotropy'
    hamiltonian: '$H_L = \sum_j \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1} + D \sum_j (S_j^z)^2$'
    slug: spin1_largeD
    cells: 'sites'
    gap_source: '12-site ring, exact diagonalization'
  - key: heisenberg-ladder
    name: 'Two-leg spin-1/2 Heisenberg ladder'
    hamiltonian: >-
      $H_L = \sum_{j} \sum_{a=1,2} \boldsymbol{S}_{a,j} \cdot \boldsymbol{S}_{a,j+1} + J_\perp \sum_j
      \boldsymbol{S}_{1,j} \cdot \boldsymbol{S}_{2,j}$
    slug: heisenberg_ladder
    cells: 'rungs ($N = 2L$ spins)'
    gap_source: '10-rung ring, exact diagonalization'
  - key: two-leg-tfim
    name: 'Two-leg transverse-field Ising ladder'
    hamiltonian: >-
      $H_L = -\sum_j (Z_{j,a} Z_{j+1,a} + Z_{j,b} Z_{j+1,b} + Z_{j,a} Z_{j,b}) - g \sum_j
      (X_{j,a} + X_{j,b})$
    slug: two_leg_tfim
    cells: 'rungs ($N = 2L$ spins)'
    gap_source: '8-rung ring, exact diagonalization'
  - key: ising-longitudinal
    name: 'Ising chain in transverse and longitudinal fields'
    hamiltonian: '$H_L = -\sum_j Z_j Z_{j+1} - g \sum_j X_j - h \sum_j Z_j$'
    slug: tfim_longitudinal
    cells: 'sites'
    gap_source: '12-site ring, exact diagonalization'
    grid: {rows: g, cols: h}
  - key: cluster
    name: 'Cluster chain in a transverse field'
    hamiltonian: '$H_L = -\sum_j Z_{j-1} X_j Z_{j+1} - g \sum_j X_j$'
    cells: 'two-site cells'
    gap_source: 'exact (free fermions)'
  - key: xy-field
    name: 'XY chain in a field'
    hamiltonian: '$H_L = \sum_j (J_x X_j X_{j+1} + J_y Y_j Y_{j+1}) - h \sum_j Z_j$, $J_x J_y < 0$'
    cells: 'sites'
    gap_source: 'exact (free fermions)'
  - key: spin1-blbq
    name: 'Spin-1 bilinear–biquadratic chain'
    hamiltonian: >-
      $H_L = \sum_j \left[\cos\theta\, \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1} + \sin\theta\,
      (\boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1})^2\right]$
    slug: blbq_haldane
    cells: 'sites'
    gap_source: 'numerical estimate'
  - key: spin2-heisenberg
    name: 'Spin-2 Heisenberg chain'
    hamiltonian: '$H_L = \sum_j \boldsymbol{S}_j \cdot \boldsymbol{S}_{j+1}$'
    slug: spin2
    cells: 'sites'
    gap_source: >-
      <a href="https://arxiv.org/abs/cond-mat/9911047">Todo and Kato</a>, quantum Monte Carlo
  - key: aklt-honeycomb
    name: 'Spin-3/2 AKLT model on the honeycomb lattice (2+1 dimensions)'
    hamiltonian: >-
      $H = \sum_{\langle ij \rangle} P^{(3)}_{ij}$, the projector onto total spin 3 of each
      bond
    slug: aklt
    cells: 'tori'
    gap_source: '8-spin torus, exact diagonalization (not a bulk value)'

# Open problems shown on the leaderboard.
challenges:
  - id: open-chain-boundary-field
    family: spin1-open
    title: 'The open spin-1 chain'
    need: >-
      Lean 4 proves the open-chain bound $\Delta_n > (\log 10)/392$ for odd $n \ge 1921$ (#74).
      The proof assumes four finite bounds from the boundary-field preprint. Certify these four
      bounds by computer.
    link: 'https://github.com/openai/math/blob/main/preprints/A-boundary-field-gap-for-the-spin-one-Heisenberg-chain-September-24-2026/paper.pdf'
  - id: spin1-small-seed
    family: spin1-heisenberg
    title: 'A small seed for spin-1'
    need: >-
      Certify the spin-1 seed calculation on rings of at most 12 sites, to an error of $10^{-3}$.
      This gives $\Delta_L > 0.039$ for all even $L \ge 60$, and the calculation is small enough
      for Lean 4 to check.
    link: code/models/lean_seeds/README.md
  - id: lean-odd-seed
    family: spin1-dimerized
    title: 'Odd seeds in Lean'
    need: >-
      One bound, for the dimerized spin-1 chain at $\delta = 7/10$, uses a seed of 3 cells. Its
      Lean 4 proof needs one more lemma: the transfer operator factors as $X_\beta = K K^*$.
      Prove this lemma in Lean 4.
    link: code/models/spin1_dimerized/README.md


