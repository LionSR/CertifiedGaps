  # ---------------------------------------------------------------- spin1-heisenberg
  - id: spin1-temperature-lifting
    family: spin1-heisenberg
    parameter: 'periodic ring'
    lengths: {L0: 36}
    bound: {r: "16689019/2500000", beta: "833/32", decimal: "0.072930044", display: '\log(6.6756076)/(833/32)'}
    seed: {n0: 60, beta0: "833/32", text: 'a ring of 60 sites; a ring of 36 sites at $\beta_0 = 49/4$ covers the lengths from 36 to 72'}
    numerical_gap: "0.41048"
    tier: lean-conditional
    lean: {name: Leaderboard.Records.SpinOneHeisenberg.temperature_lifting, r: "16689019/2500000", beta: "833/32", decimal: "0.072930044"}
    certificate: models/spin1/experiments/temperature-lift.json
    check: models/spin1/experiments/test_temperature_lift.jl
    date: "2026-10-17"
    pr: null
    contributors: ['LionSR']
    notes: >-
      The starting inequalities are computed in exact rational arithmetic from the finite inputs
      of the OpenAI preprint, reproduced here (18 thermal traces of rings up to 12 sites and one
      matrix-product trial state of 120 sites). Independently reviewed in #49, by re-deriving
      every inequality and by a separate computation in Arb ball arithmetic that shares no code
      with the original. The Lean theorem assumes the two inequalities at each starting ring: 60
      sites at $\beta_0 = 833/32$ and 36 sites at $\beta_0 = 49/4$. Lean follows the doubling for
      14 steps where the computer proof follows it for 10, so its bound is slightly larger.
    history:
      - {date: "2026-10-10", decimal: "0.072901771", lengths: 'even L ≥ 36', tier: certified, pr: null,
         method: 'the computer proof from the same two starting rings'}
      - {date: "2026-10-10", decimal: "0.070450002", lengths: 'even L ≥ 36', tier: certified, pr: null,
         method: 'the same computation with simpler parameters'}
      - {date: "2026-10-10", decimal: "0.016978269", lengths: 'even L ≥ 36', tier: certified, pr: null,
         method: 'a sharper analysis of the same preprint inputs'}
  - id: spin1-source1
