# Leaderboard of certified spectral gaps: the single hand-edited source of every leaderboard row.
#
# Rendered by home_page/leaderboard.html; validated by tools/leaderboard/check_records.jl (run it
# after every edit: `julia --project=tools/leaderboard tools/leaderboard/check_records.jl`).
# Exact numbers are strings: integers "13480", rationals "97/4". Decimals are strings rounded DOWN.
# Math fields hold LaTeX between $...$; it is typeset by MathJax on the page.
#
# families: one entry per model family (a Hamiltonian with free parameters).
#   key          unique identifier, referenced by records[].family
#   name         display name
#   hamiltonian  LaTeX formula for H_L
#   slug         default model directory, models/<slug>/ (optional)
#   cells        what the ring length L counts (sites, two-site cells, rungs, ...)
#   grid         {rows, cols}: optional; show the family as a grid of params[rows] x params[cols]
#
# records: one entry per model, parameter point and claim.
#   id             unique kebab-case identifier (the row's anchor on the page)
#   family         a families[].key
#   parameter      display form of the parameter point (LaTeX)
#   params         machine-readable parameter values, {name: exact string} (optional)
#   slug           model directory if it differs from the family's (optional)
#   lengths        {L0, parity: even|odd|all, unit, boundary: periodic|open (default periodic),
#                   text (optional display override)}: the claim covers every ring length L >= L0
#                   of that parity
#   bound          the best rigorous bound on the gap Delta_L at these lengths, in one of two forms:
#                    {r, beta}  meaning Delta_L > log(r)/beta, or
#                    {value}    meaning Delta_L >= value (or > value when strict: true),
#                  plus decimal (rounded down, required), precise (a longer decimal, rounded down;
#                  required when value has more than 24 characters, and shown instead of it) and
#                  display (LaTeX of the exact form, optional). Absent for tier target.
#   seed           {n0, beta0, text (optional)}: the seed scale of the certificate
#   estimate       tier target only: {n0, beta0, float_bound} from floating-point surveys
#   numerical_gap  best known numerical estimate {value, source}; the page shows bound/value
#   tier           the tier of the headline bound (not of the row):
#                  lean-unconditional | lean-conditional | certified | unreviewed | assumed | target.
#                  A lean-* tier is allowed exactly when the Lean bound log(r)/beta is at least the
#                  headline bound (compared exactly by the validator); the page then shows the Lean
#                  kind from lean_records.json. Otherwise the tier is that of the certificate.
#   lean           Lean record {name, L0, r, beta, decimal}: the theorem Delta_L > log(r)/beta for
#                  every even L >= L0, shown in the Lean column with its own badge. Must match the
#                  record of that name in the generated lean_records.json; the page takes the Lean
#                  kind (unconditional or conditional) from that file, never from here.
#   certificate    path of the certificate data (results/certificate*.json[.gz]) from the repo root
#   check          path of the checker (models/<slug>/check.jl) from the repo root
#   source         {text, url}: for assumed results, where the imported estimates come from
#   date           ISO date of the current record; pr: pull request number (or null)
#   contributors   list of names (optional)
#   notes          free text with inline HTML and $...$ math, not Markdown (optional)
#   history        earlier records for the same row, newest first (same date: larger bound first):
#                  [{date, decimal, display (optional), lengths, method, tier, pr}]
#
# Tiers (see the legend on the leaderboard page):
#   lean-unconditional  Lean theorem using only the standard axioms, no hypotheses
#   lean-conditional    Lean theorem whose only hypotheses are the two seed inequalities; the seeds
#                       are certified by computer in models/<slug>/
#   certified           rigorous computer certificate with check.jl (any Lean record is weaker)
#   unreviewed          certificate exists but has not been independently reviewed
#   assumed             relies on estimates imported from elsewhere, not reproduced here
#   target              floating-point survey estimates only

families:
  - key: spin1-heisenberg
    name: Spin-1 Heisenberg chain
    hamiltonian: '$H_L = \sum_{j=1}^{L} \mathbf{S}_j \cdot \mathbf{S}_{j+1}$, $\mathbf{S}_j^2 = 2$'
    slug: spin1
    cells: sites
  - key: spin1-open
    name: Spin-1 Heisenberg open chain with endpoint fields
    hamiltonian: '$H_n = \sum_{i=1}^{n-1} \mathbf{S}_i \cdot \mathbf{S}_{i+1} - h\,(S_1^z + S_n^z)$'
    cells: sites
  - key: heisenberg-staggered-field
    name: Spin-1/2 Heisenberg chain in a staggered field
    hamiltonian: '$H_L = \sum_j \mathbf{S}_j \cdot \mathbf{S}_{j+1} - h \sum_j (-1)^j S_j^z$'
    slug: heisenberg_staggered_field
    cells: sites
  - key: dimerized-heisenberg
    name: Dimerized spin-1/2 Heisenberg chain
    hamiltonian: '$H_L = (1+\delta) \sum_j \mathbf{S}_{2j-1} \cdot \mathbf{S}_{2j} + (1-\delta) \sum_j \mathbf{S}_{2j} \cdot \mathbf{S}_{2j+1}$'
    slug: dimerized_heisenberg
    cells: two-spin cells ($N = 2L$ spins)
  - key: spin1-dimerized
    name: Dimerized spin-1 Heisenberg chain
    hamiltonian: '$H_L = \sum_{j=1}^{2L} [1 + (-1)^j \delta]\, \mathbf{S}_j \cdot \mathbf{S}_{j+1}$'
    slug: spin1_dimerized
    cells: two-spin cells ($N = 2L$ spins)
  - key: spin1-largeD
    name: Spin-1 chain with single-ion anisotropy
    hamiltonian: '$H_L = \sum_j \mathbf{S}_j \cdot \mathbf{S}_{j+1} + D \sum_j (S_j^z)^2$'
    slug: spin1_largeD
    cells: sites
  - key: heisenberg-ladder
    name: Two-leg spin-1/2 Heisenberg ladder
    hamiltonian: '$H_L = \sum_{j} \sum_{a=1,2} \mathbf{S}_{a,j} \cdot \mathbf{S}_{a,j+1} + J_\perp \sum_j \mathbf{S}_{1,j} \cdot \mathbf{S}_{2,j}$'
    slug: heisenberg_ladder
    cells: rungs ($N = 2L$ spins)
  - key: two-leg-tfim
    name: Two-leg transverse-field Ising ladder
    hamiltonian: '$H_L = -\sum_j (Z_{j,a} Z_{j+1,a} + Z_{j,b} Z_{j+1,b} + Z_{j,a} Z_{j,b}) - g \sum_j (X_{j,a} + X_{j,b})$'
    slug: two_leg_tfim
    cells: rungs ($N = 2L$ spins)
  - key: ising-longitudinal
    name: Ising chain in transverse and longitudinal fields
    hamiltonian: '$H_L = -\sum_j Z_j Z_{j+1} - g \sum_j X_j - h \sum_j Z_j$'
    slug: tfim_longitudinal
    cells: sites
    grid: {rows: g, cols: h}
  - key: cluster
    name: Cluster chain in a transverse field
    hamiltonian: '$H_L = -\sum_j Z_{j-1} X_j Z_{j+1} - g \sum_j X_j$'
    cells: two-site cells
  - key: xy-field
    name: XY chain in a field
    hamiltonian: '$H_L = \sum_j (J_x X_j X_{j+1} + J_y Y_j Y_{j+1}) - h \sum_j Z_j$, $J_x J_y < 0$'
    cells: sites
  - key: spin1-blbq
    name: Spin-1 bilinear–biquadratic chain
    hamiltonian: '$H_L = \sum_j \left[\cos\theta\, \mathbf{S}_j \cdot \mathbf{S}_{j+1} + \sin\theta\, (\mathbf{S}_j \cdot \mathbf{S}_{j+1})^2\right]$'
    slug: blbq_haldane
    cells: sites
  - key: spin2-heisenberg
    name: Spin-2 Heisenberg chain
    hamiltonian: '$H_L = \sum_j \mathbf{S}_j \cdot \mathbf{S}_{j+1}$, $\mathbf{S}_j^2 = 6$'
    slug: spin2
    cells: sites
  - key: aklt-honeycomb
    name: Spin-3/2 AKLT model on the honeycomb lattice (2+1 dimensions)
    hamiltonian: '$H = \sum_{\langle ij \rangle} P^{(3)}_{ij}$, the projector onto total spin 3 of each bond'
    slug: aklt
    cells: tori

