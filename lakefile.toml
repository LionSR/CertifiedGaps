# The Lean package of the repository. Its sources live in lean/ (srcDir); the lakefile sits at
# the repository root so that leanblueprint, checkdecls and docgen-action work as designed.
name = "CertifiedGaps"
defaultTargets = ["CertifiedGaps", "SeedKernel"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"


[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "CertifiedGaps"
srcDir = "lean"

# Kernel-checked seed arithmetic (spin-1 and Ising). The root `SeedKernel.Audit` prints the
# axioms of every main declaration.
[[lean_lib]]
name = "SeedKernel"
srcDir = "lean"
roots = ["SeedKernel", "SeedKernel.Audit"]

# Kernel benchmarks (several minutes, up to ~4 GB per file), opt-in: `lake build SeedKernelBench`.
# No roots, so that checkdecls (which imports the roots of every library) does not load them.
[[lean_lib]]
name = "SeedKernelBench"
srcDir = "lean"
roots = []
globs = ["SeedKernel.Bench.+"]
