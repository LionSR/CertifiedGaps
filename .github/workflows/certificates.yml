name: Check certificates

# Run the fast checker (check.jl, default mode) of model directories. A pull request or push to main
# that changes models/ (excluding documentation) checks the changed model directories; a change to
# the core package (julia/, excluding documentation), the weekly schedule, or a manual run checks
# every model directory that records.yml references. Leaderboard data in home_page/_data/records.yml
# is validated against both the certificates and the Lean audit in blueprint.yml.
on:
  pull_request:
    branches:
      - main
    paths:
      - "models/**"
      - "julia/**"
      - "tools/leaderboard/**"
      - "lean/CertifiedGaps/Models/**"
      - "lean/scripts/check_seeds.jl"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "models/**"
      - "julia/**"
      - "tools/leaderboard/**"
      - "lean/CertifiedGaps/Models/**"
      - "lean/scripts/check_seeds.jl"
      - "!**/*.md"
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: certificates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core and leaderboard tests
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12"

      - name: Cache Julia packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Test the core package
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

      # The seed defects hardcoded in the Lean model files against the certificates.
      - name: Check the Lean seeds
        run: julia --project=julia lean/scripts/check_seeds.jl

      - name: Test the leaderboard validator and check the records against the certificates
        run: |
          julia --project=tools/leaderboard -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
          julia --project=tools/leaderboard tools/leaderboard/check_records.jl

  changed:
    name: Find models to check
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.list.outputs.models }}
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The base commit of a pull request or push, for the diff; the shallow checkout lacks it.
      - name: Fetch the base commit
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
          fi

      # Model directories with a check.jl, as a JSON list. lean_seeds is left out: its checker
      # drives the Lean toolchain (lake build SeedKernel), which blueprint.yml already covers.
      - name: List model directories
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          records=home_page/_data/records.yml
          # Checkers rerun the core arithmetic, so a non-doc change to julia/ rechecks every model;
          # otherwise on PRs and pushes, only check models with non-doc changes under models/<slug>/.
          if ( [ "$EVENT" = pull_request ] || [ "$EVENT" = push ] ) && \
             [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed_nondoc=$(git diff --name-only "$BASE_SHA" HEAD | grep -vE '\.md$' || true)
            if echo "$changed_nondoc" | grep -qE '^julia/'; then
              slugs=$( (grep -oE 'models/[A-Za-z0-9_]+/' "$records" | cut -d/ -f2;
                        sed -nE 's/^[[:space:]]*slug:[[:space:]]*([A-Za-z0-9_]+).*/\1/p' "$records") )
            else
              slugs=$(echo "$changed_nondoc" | grep -E '^models/' | cut -d/ -f2 || true)
            fi
          else
            # Every directory referenced by a slug, certificate or check field.
            slugs=$( (grep -oE 'models/[A-Za-z0-9_]+/' "$records" | cut -d/ -f2;
                      sed -nE 's/^[[:space:]]*slug:[[:space:]]*([A-Za-z0-9_]+).*/\1/p' "$records") )
          fi
          models=$(echo "$slugs" | sort -u \
            | while read -r slug; do
                if [ -n "$slug" ] && [ -f "models/$slug/check.jl" ] && [ "$slug" != lean_seeds ]; then
                  echo "$slug"
                fi
              done \
            | jq -R . | jq -cs .)
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "Models to check: $models"

  check:
    name: check.jl (${{ matrix.model }})
    needs: changed
    if: needs.changed.outputs.models != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.changed.outputs.models) }}
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12"

      # One cache for all matrix jobs: they share the core package and most dependencies.
      - name: Cache Julia packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          include-matrix: false

      # spin1 checks its outputs against the preprint's evidence files (pinned commit, hashes).
      - name: Fetch the upstream evidence
        if: matrix.model == 'spin1'
        run: julia tools/fetch_upstream.jl

      # Models run in the core environment (julia/), except the few with their own Project.toml
      # (AGENTS.md, "Environment"), whose Manifest develops the core from ../../julia.
      - name: Choose the environment
        env:
          MODEL: ${{ matrix.model }}
        run: |
          if [ -f "models/$MODEL/Project.toml" ]; then project="models/$MODEL"; else project=julia; fi
          echo "PROJECT=$project" >> "$GITHUB_ENV"

      - name: Instantiate the environment
        run: julia --project="$PROJECT" -e 'using Pkg; Pkg.instantiate()'

      - name: Run the checker
        env:
          MODEL: ${{ matrix.model }}
        run: julia --project="$PROJECT" "models/$MODEL/check.jl"
