name: Check certificates

# Run the fast checker (check.jl, default mode) of every model directory a pull request changes.
on:
  pull_request:
    branches:
      - main
    paths:
      - "models/**"

concurrency:
  group: certificates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    name: Find changed models
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.diff.outputs.models }}
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # the base commit is needed for the diff

      # Model directories with a check.jl among the changed paths, as a JSON list. lean_seeds is
      # left out: its checker drives the Lean toolchain (lake build SeedKernel), which the Lean
      # build in blueprint.yml already covers.
      - name: List changed model directories
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          models=$(git diff --name-only "$BASE_SHA" HEAD -- models/ \
            | cut -d/ -f2 | sort -u \
            | while read -r slug; do
                if [ -f "models/$slug/check.jl" ] && [ "$slug" != lean_seeds ]; then
                  echo "$slug"
                fi
              done \
            | jq -R . | jq -cs .)
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "Changed models with a checker: $models"

  check:
    name: check.jl (${{ matrix.model }})
    needs: changed
    if: needs.changed.outputs.models != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.changed.outputs.models) }}
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12"

      - name: Cache Julia packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      # spin1 checks its outputs against the preprint's evidence files (pinned commit, hashes).
      - name: Fetch the upstream evidence
        if: matrix.model == 'spin1'
        run: julia tools/fetch_upstream.jl

      # Each model's Manifest develops the core package from ../../julia, inside this checkout.
      - name: Instantiate the model environment
        run: julia --project=models/${{ matrix.model }} -e 'using Pkg; Pkg.instantiate()'

      - name: Run the checker
        run: julia --project=models/${{ matrix.model }} models/${{ matrix.model }}/check.jl
