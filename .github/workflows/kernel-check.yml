name: Kernel re-check

# Replay every declaration of the Leaderboard library, the continuous-history/kernel audits,
# and the repository modules they import
# through the Lean kernel with leanchecker (bundled with the toolchain; the upstreamed
# lean4checker). This catches `set_option debug.skipKernelTC true` and declarations written into
# the environment by metaprograms. It runs apart from the deploy (blueprint.yml), so it never
# blocks the site.
on:
  pull_request:
    # Stacked pull requests need the same kernel checks as PRs targeting main.
    paths:
      - "code/leaderboard/**"
      - "code/lean/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "code/leaderboard/**"
      - "code/lean/**"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "!**/*.md"
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

concurrency:
  group: kernel-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  leanchecker:
    name: leanchecker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Installs elan and the toolchain and fetches the Mathlib cache; the build is the next step.
      # No GitHub cache: each run would save another 2 GB .lake cache keyed by commit, and those
      # pushed docgen's API-docs cache out of the repository's 10 GB limit.
      - name: Set up Lean
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true
          use-github-cache: false

      # Include the continuous-history/kernel audits, which are independent of the current
      # finite-dimensional leaderboard proofs. Exclude the SeedKernel benchmarks.
      - name: Build the Leaderboard and continuous-history/kernel audits
        run: >-
          ~/.elan/bin/lake build Leaderboard
          CertifiedGaps.Transfer.PoissonHistoryAudit
          CertifiedGaps.Transfer.HistoryShuffleAudit
          CertifiedGaps.Transfer.ProductPoissonHistoryAudit
          CertifiedGaps.Transfer.ContinuousKernel.Audit
          CertifiedGaps.Transfer.SpinOneKernelAudit

      # One exact module per process avoids the observed 4.36.0-rc1 repeated-replay crash.
      # The CLI also expands namespace prefixes; the driver calls the unchanged replay routine.
      # This also avoids rescanning the dependency .olean tree for every module argument.
      - name: Re-check every built module in the kernel
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          mods=$(cd .lake/build/lib/lean && find . -name '*.olean' \
            | sed -e 's|^\./||' -e 's|\.olean$||' -e 's|/|.|g' | sort)
          test -n "$mods"
          echo "Modules: $(printf '%s\n' "$mods" | wc -l)"
          # Expand $module in the inner shell, once per module.
          # shellcheck disable=SC2016
          ~/.elan/bin/lake env bash -euo pipefail -c '
            while IFS= read -r module; do
              KERNEL_CHECK_MODULE="$module" lean code/lean/scripts/KernelCheck.lean
            done
          ' <<< "$mods"
