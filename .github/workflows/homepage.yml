name: Deploy home page

# The full deploy (blueprint.yml) rebuilds the Lean API docs, which can take hours, and deploys
# on main wait for each other. This workflow republishes the site in a few minutes: it builds the
# Jekyll pages, the notes and the explainer of the current main and lays them over the newest full
# deploy (its `site` artifact), which keeps the API docs, the blueprint and the films. The
# leaderboard rows and Lean records also come from that full deploy, where they were validated,
# so a leaderboard edit still waits for a full deploy.
#
# It runs on pushes that touch the pages, the notes or the explainer, and again after every full
# deploy, so that a long build of an older commit never leaves an older home page live.

on:
  push:
    branches:
      - main
    paths:
      - "home_page/**"
      - "paper/**"
      - "supplementary/explainer/**"
      - ".github/workflows/homepage.yml"
  workflow_run:
    workflows: ["Compile blueprint"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Only the newest pages matter.
concurrency:
  group: homepage
  cancel-in-progress: true

permissions:
  contents: read
  actions: read           # Find and download the full deploy's `site` artifact
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  deploy:
    # After a full deploy, only when it succeeded and so uploaded a fresh `site` artifact.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Deploy home page
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download the newest full deploy
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=site&per_page=100" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")]
              | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "::notice::No full deploy has kept its site yet; blueprint.yml will publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > site.zip
          mkdir full && unzip -q site.zip -d full
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Use the leaderboard data of that deploy
        if: steps.site.outputs.found == 'true'
        run: cp full/_data/records.yml full/_data/lean_records.json home_page/_data/

      # The same copy as in blueprint.yml.
      - name: Copy the explainer and the notes into the site
        if: steps.site.outputs.found == 'true'
        run: |
          rsync -a --exclude '.*' --exclude '*.mp4' --exclude 'node_modules/' \
            --exclude 'package*.json' --exclude '*.narration.wav' --exclude 'render.mjs' \
            --exclude 'README.md' supplementary/explainer/ home_page/explainer/
          mkdir -p home_page/notes
          cp paper/*.pdf home_page/notes/

      - name: Set up Ruby
        if: steps.site.outputs.found == 'true'
        uses: ruby/setup-ruby@eaecf785f6a34567a6d97f686bbb7bccc1ac1e5c # v1.237.0
        with:
          working-directory: home_page
          ruby-version: "3.1" # the Ruby of home_page/Gemfile.lock (github-pages 226)
          bundler-cache: true

      # The command docgen-action runs.
      - name: Build the pages with Jekyll
        if: steps.site.outputs.found == 'true'
        working-directory: home_page
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: JEKYLL_ENV=production bundle exec jekyll build

      # New pages replace old ones; the API docs, blueprint and films of the full deploy stay. A
      # page deleted from home_page/ stays live until the next full deploy.
      - name: Lay the pages over the full deploy
        if: steps.site.outputs.found == 'true'
        run: rsync -a home_page/_site/ full/_site/

      - name: Upload the site
        if: steps.site.outputs.found == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: full/_site

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.found == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
