name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
    # Pages, notes and explainer alone go live through homepage.yml in minutes, without
    # rebuilding the API docs. The leaderboard rows are validated here, so they still deploy here.
    paths:
      - "**"
      - "!home_page/**"
      - "!paper/**"
      - "!supplementary/explainer/**"
      - "home_page/_data/records.yml"
  pull_request:
    branches:
      - main # Build and check pull requests into the default branch (no deploy)
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# One run per ref at a time; a newer push waits for (main) or replaces (PRs) the running one
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  # Cancel superseded PR builds only. A deploy on main takes about four hours (most of it
  # doc-gen4), so cancelling it whenever another PR merges meant no deploy ever finished.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages. Only the push-gated
# upload and deploy steps use them; pull-request runs, including read-only fork runs, need none.
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  actions: write          # Delete superseded `site` artifacts (see the last step)

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Jekyll copies the generated API docs into _site, which ran out of the 25 GB left after
          # removing Android alone (run 39019463651). Remove everything except the tool cache, which
          # holds the Ruby that docgen-action sets up.
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # The default targets include the Leaderboard library. The kernel re-check (leanchecker)
      # runs in kernel-check.yml, so that it never blocks the deploy.
      - name: Build and lint project
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          build: true
          lint: false # no lint driver is configured
          mk_all-check: false # mk_all does not follow srcDir = "code/lean"
          # Each cached run saves a 2 GB .lake cache keyed by commit. Keep that to deploys, so
          # pull requests do not push docgen's API-docs cache out of the 10 GB limit.
          use-github-cache: ${{ github.event_name != 'pull_request' }}

      # The leaderboard (home_page/leaderboard.html): list every Lean record with its numbers and
      # axioms in home_page/_data/lean_records.json (read by the page, never committed). Fails on
      # any axiom outside propext, Classical.choice, Quot.sound.
      - name: Audit the leaderboard records
        run: ~/.elan/bin/lake exe leaderboard_audit home_page/_data/lean_records.json

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12"

      - name: Cache Julia packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      # Schema, paths, rounded-down decimals (exact arithmetic), agreement with the Lean records,
      # and a scan of code/leaderboard/ for sorry, native_decide, axiom, implemented_by and extern.
      - name: Validate the leaderboard data
        env:
          OPENBLAS_NUM_THREADS: 1
        run: |
          julia --project=code/tools/leaderboard -e 'using Pkg; Pkg.instantiate()'
          julia --project=code/tools/leaderboard code/tools/leaderboard/check_records.jl \
            --lean-records home_page/_data/lean_records.json

      # Jekyll copies files without front matter verbatim, so the explainer and the PDFs are served
      # unchanged. These copies are build products (see .gitignore).
      - name: Copy the explainer and the notes into the site
        run: |
          rsync -a --exclude '.*' --exclude '*.mp4' --exclude 'node_modules/' \
            --exclude 'package*.json' --exclude '*.narration.wav' --exclude 'render.mjs' \
            --exclude 'README.md' supplementary/explainer/ home_page/explainer/
          mkdir -p home_page/notes
          cp paper/*.pdf home_page/notes/

      # The narrated films (about 100 MB) are too large for git; they are assets of the `films`
      # release, uploaded after each render (supplementary/explainer/README.md). Only deploys need them, and
      # fork pull requests cannot read this private repository's releases.
      - name: Download the explainer films
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download films --pattern '*.mp4' --dir home_page/explainer

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05
        with:
          blueprint: true
          homepage: home_page
          ruby-version: "3.1" # the Ruby of home_page/Gemfile.lock (github-pages 226)

      # homepage.yml republishes the pages on top of this build's API docs, blueprint and films.
      # Keep the built site, with the leaderboard data validated above, and only the newest copy.
      - name: Keep the built site for home-page deploys
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: |
            home_page/_site
            home_page/_data/records.yml
            home_page/_data/lean_records.json
          retention-days: 90

      - name: Delete older copies of the built site
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=site&per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            done
