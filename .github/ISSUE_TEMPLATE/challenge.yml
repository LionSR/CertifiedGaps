name: Take on a challenge
description: Coordinate work on an open challenge or on improving a leaderboard record.
title: "Challenge: "
labels: ["challenge"]
body:
  - type: markdown
    attributes:
      value: |
        This issue coordinates work on open challenges and record improvements. The leaderboard's
        "Take this on" and "Improve this record" buttons pre-fill the identifier below.
  - type: input
    id: challenge
    attributes:
      label: Challenge or leaderboard row
      description: The identifier from the leaderboard, for example ladder-Jperp-3-lean.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Your planned approach (for example, a larger seed length n0, a sharper spectral enclosure, or a Lean 4 formalization).
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: Questions
      description: Any questions or context where feedback would help.
